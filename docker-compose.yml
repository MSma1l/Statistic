services:
  db:
    image: postgres:16-alpine
    container_name: statistic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statistic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statistic}
      POSTGRES_DB: ${POSTGRES_DB:-statistic}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # BIND_HOST gol (local) => expune pe toate interfețele. În producție
      # pune BIND_HOST=127.0.0.1: ca să fie accesibil DOAR de pe server.
      - "${BIND_HOST:-}${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statistic} -d ${POSTGRES_DB:-statistic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: statistic_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-statistic}:${POSTGRES_PASSWORD:-statistic}@db:5432/${POSTGRES_DB:-statistic}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@statistic.app}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin1234}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # AI (consultant CRO + gardian GDPR). Gol => feature-ul AI e dezactivat
      # grațios; restul aplicației merge normal. Pune cheia în .env la producție.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
    ports:
      - "${BIND_HOST:-}${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Local: URL-ul absolut al backend-ului (cross-origin, cu CORS).
        # Producție (un singur domeniu + nginx dispecer): lasă VITE_API_URL GOL
        # în .env => cereri relative `/api/...`, same-origin, fără CORS.
        # `-` (nu `:-`): un VITE_API_URL setat GOL e respectat, nu înlocuit.
        VITE_API_URL: ${VITE_API_URL-http://localhost:8000}
    container_name: statistic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_HOST:-}${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
