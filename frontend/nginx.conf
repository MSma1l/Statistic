# ============================================================================
#  nginx-ul INTERN al aplicației Statistic (rulează în containerul frontend).
#  Rol dublu:
#    1. servește SPA-ul React (build static din /usr/share/nginx/html)
#    2. face DISPECER same-origin: rutele backend-ului (/api /auth /px /l /q
#       /health) sunt trimise către containerul backend `backend:8000`.
#  Așa, proxy-ul public (nginx_proxy) trimite TOT traficul subdomeniului către
#  ACEST container, iar split-ul frontend/backend se face aici (ca la celelalte
#  aplicații de pe server, ex. balloonsbreeze-web).
# ============================================================================

# Păstrează schema originală (https) primită de la proxy-ul public; dacă lipsește
# (acces direct), cade pe schema locală. `map` e permis aici: fișierul e inclus
# în contextul http.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload galerie (limita 25MB) + overhead multipart.
    client_max_body_size 30m;

    # DNS-ul intern Docker: rezolvă upstream-ul lazy (backend-ul poate reporni
    # fără să pice nginx-ul frontend).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Nume de container UNIC (nu `backend`): pe `shared-network` există și alte
    # containere cu alias `backend` (ex. IQ-Arena), iar Docker DNS ar rezolva
    # aleator spre backend-ul greșit. `statistic_backend` e neambiguu.
    set $backend http://statistic_backend:8000;

    # Headere comune spre backend (moștenite de toate location-urile de mai jos).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;

    # --- Rutele backend-ului (same-origin) ---
    # `^~` = dacă prefixul se potrivește, NU mai verifica location-urile regex.
    # Necesar ca /px/t.js și /api/links/{id}/qr.png|svg să ajungă la backend, nu
    # la location-ul de fișiere statice (altfel .js/.png/.svg ar da 404).
    # Prefixe cu `/` final ca să NU prindem rutele SPA (ex. /login NU e /l/).
    location ^~ /api/    { proxy_pass $backend; }
    location ^~ /auth/   { proxy_pass $backend; }
    location ^~ /px/     { proxy_pass $backend; proxy_buffering off; }  # beacon/ingest
    location ^~ /l/      { proxy_pass $backend; }                       # redirect link
    location ^~ /q/      { proxy_pass $backend; }                       # redirect QR
    location = /health   { proxy_pass $backend; }

    # --- SPA static ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
