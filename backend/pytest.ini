[pytest]
# Mod auto: funcțiile `async def test_*` sunt rulate automat ca teste asyncio.
asyncio_mode = auto
# Un singur event loop pentru întreaga sesiune (fixture + teste) → engine/asyncpg
# partajat fără erori „attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
