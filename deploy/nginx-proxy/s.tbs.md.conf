# ============================================================================
#  s.tbs.md — domeniul SCURT pentru linkuri & QR (redirect curat, fără /l/ /q/)
# ----------------------------------------------------------------------------
#  Rol      : rezolvă https://s.tbs.md/<slug>  → redirect (click)
#             QR-ul encodează  https://s.tbs.md/<slug>?q=1  → redirect (scan)
#  Upstream : container `statistic_backend:8000` (ruta /{slug} din backend)
#  Pune la  : /root/nginx-proxy/conf.d/s.tbs.md.conf
#  DNS      : A-record  s.tbs.md → IP server   (subdomeniu al lui tbs.md, e al tău)
#  Reload   : docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#
#  Ca la celelalte: FAZA 1 (doar :80) pentru emiterea certului, apoi FAZA 2 (:443).
# ============================================================================

# ─── FAZA 1 — HTTP (înainte de certificat) ───────────────────────────────
server {
    listen 80;
    server_name s.tbs.md;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stat http://statistic_backend:8000;

    # Doar slug-uri (un singur segment) merg la backend; QR-ul poate avea ?q=1.
    location ~ ^/[A-Za-z0-9._-]+/?$ {
        proxy_pass $stat;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = / { return 404; }   # nimic altceva pe domeniul scurt
}

