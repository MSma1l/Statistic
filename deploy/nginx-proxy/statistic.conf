# ============================================================================
#  Statistic — vhost pentru `nginx_proxy` (proxy-ul public comun)
# ----------------------------------------------------------------------------
#  Domeniu   : statistica.tbs.md
#  Upstream  : container `statistic_frontend:80` pe rețeaua `shared-network`
#              (frontend-ul face dispecerul intern /api /auth /px /l /q -> backend)
#  Pune la   : /root/nginx-proxy/conf.d/statistic.conf
#  Reload    : docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#
#  ⚠️ PRIMA DATĂ certificatul nu există încă → blocul 443 pică la `nginx -t`.
#  Procedura (identică cu runbook-ul tău de la iqarena-game/balloonsbreeze):
#    1. Lasă DOAR blocul HTTP :80 „FAZA 1" activ (comentează restul).
#    2. Reload:  docker exec nginx_proxy nginx -t && docker exec nginx_proxy nginx -s reload
#    3. Emite certul (webroot — vezi docs/operare/03-deployment.md).
#    4. Comentează „FAZA 1", decomentează „FAZA 2" (80 redirect + 443), reload.
# ============================================================================

# ─────────────────────────────────────────────────────────────────────────
#  FAZA 1 — HTTP simplu (test înainte de certificat). Servește aplicația pe :80.
#  Ține COOKIE_SECURE=false în .env.prod cât ești în faza asta.
# ─────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name statistica.tbs.md;

    # ACME challenge (pentru emiterea certului webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 30m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stat http://statistic_frontend:80;

    location / {
        proxy_pass $stat;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────────────────────────────────
#  FAZA 2 — HTTPS (după ce ai certificatul). Decomentează tot blocul de mai jos
