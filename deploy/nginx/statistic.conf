# =============================================================================
#  Statistic — nginx DISPECER (rulează pe HOST-ul serverului, nu în Docker)
# =============================================================================
#  Un singur SUBDOMENIU. nginx primește totul pe portul 80 (apoi 443) și
#  "aruncă" fiecare cale unde trebuie:
#       /api  /auth  /px  /l  /q  /health  /docs   ->  backend  (127.0.0.1:8010)
#       restul (dashboard React, SPA)              ->  frontend (127.0.0.1:5180)
#
#  Instalare (vezi docs/operare/03-deployment.md):
#    sudo cp deploy/nginx/statistic.conf /etc/nginx/sites-available/statistic
#    sudo ln -s /etc/nginx/sites-available/statistic /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  >>> DE ÎNLOCUIT: peste tot în acest fișier schimbă  app.exemplu.ro  cu
#  >>> SUBDOMENIUL tău real (ex: stats.firma-mea.ro). Caută "app.exemplu.ro".
# =============================================================================

# Map pentru upgrade-ul de conexiune WebSocket / SSE (streaming AI, live).
# Trimite header-ul "Connection: upgrade" doar când clientul cere upgrade;
# altfel trimite "close". Necesar dacă backend-ul deschide WebSocket-uri.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream-uri = containerele Docker, legate pe localhost (BIND_HOST=127.0.0.1:).
# Porturile trebuie să coincidă cu BACKEND_PORT / FRONTEND_PORT din .env.prod.
upstream statistic_backend  { server 127.0.0.1:8010; }
upstream statistic_frontend { server 127.0.0.1:5180; }

server {
    listen 80;
    listen [::]:80;

    # >>> DE ÎNLOCUIT: subdomeniul tău real.
    server_name app.exemplu.ro;

    # Upload-uri galerie (imagini până la 25 MB, vezi GALLERY_MAX_BYTES) + marjă.
    client_max_body_size 30m;

    # Loguri separate pentru proiect (utile la debugging).
    access_log /var/log/nginx/statistic.access.log;
    error_log  /var/log/nginx/statistic.error.log;

    # --- Headere comune trimise spre upstream-uri --------------------------
    # Backend-ul (uvicorn --proxy-headers) citește IP-ul real din astea:
    #  - Host              => cookie-uri pe domeniul corect
    #  - X-Forwarded-For   => IP real al vizitatorului (rate-limit + IP hashing)
    #  - X-Forwarded-Proto => backend-ul știe că e HTTPS => cookie Secure corect
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Suport WebSocket / SSE (dacă backend-ul streamează răspunsuri AI live).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Nu tăia conexiunile lungi de streaming prea repede.
    proxy_read_timeout 300s;

    # ----------------------------------------------------------------------
    #  RUTE CĂTRE BACKEND (API + ingestie publică + redirect-uri)
    # ----------------------------------------------------------------------
    # `^~` = potrivire de prefix prioritară (oprește căutarea altor location-uri).
    location ^~ /api/    { proxy_pass http://statistic_backend; }
    location ^~ /auth/   { proxy_pass http://statistic_backend; }
    location ^~ /px/     { proxy_pass http://statistic_backend; }  # pixel: t.js + collect
    location ^~ /l/      { proxy_pass http://statistic_backend; }  # linkuri scurte
    location ^~ /q/      { proxy_pass http://statistic_backend; }  # QR
    location = /health   { proxy_pass http://statistic_backend; }

    # Swagger / OpenAPI (opțional — comentează blocul dacă nu vrei docs publice).
    location = /docs         { proxy_pass http://statistic_backend; }
    location = /redoc        { proxy_pass http://statistic_backend; }
    location = /openapi.json { proxy_pass http://statistic_backend; }

    # ----------------------------------------------------------------------
    #  RESTUL = FRONTEND (dashboard React; nginx-ul intern face fallback SPA)
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://statistic_frontend;
    }
}

# =============================================================================
#  HTTPS — DUPĂ ce subdomeniul pointează spre server și ai rulat certbot.
# -----------------------------------------------------------------------------
#  certbot (`sudo certbot --nginx -d app.exemplu.ro`) rescrie AUTOMAT acest
#  fișier: adaugă blocul `listen 443 ssl`, liniile cu certificatele
#      ssl_certificate     /etc/letsencrypt/live/app.exemplu.ro/fullchain.pem;
#      ssl_certificate_key /etc/letsencrypt/live/app.exemplu.ro/privkey.pem;
#  și redirect-ul 80 -> 443. NU trebuie să le scrii manual.
#
#  DUPĂ certbot:
#    1) în .env.prod:  BASE_URL/FRONTEND_ORIGIN cu https://  și  COOKIE_SECURE=true
#    2) rebuild:  docker compose --env-file .env.prod up -d --build
#
#  HSTS (recomandat, DOAR pe HTTPS): după ce HTTPS merge stabil, adaugă în
#  blocul server-ului 443 (pe care îl creează certbot) linia:
#      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#  ATENȚIE: HSTS forțează browserele să folosească HTTPS pentru max-age secunde;
#  activează-l abia când ești sigur că certificatul e stabil.
# =============================================================================
