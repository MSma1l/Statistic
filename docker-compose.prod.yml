# ============================================================================
#  Producție pe serverul cu proxy comun `nginx_proxy` (rețea `shared-network`).
#  Diferă de docker-compose.yml (dev) prin:
#    - NU publică porturi pe host (proxy-ul ajunge la containere prin rețea)
#    - frontend-ul e pe `shared-network` ca să fie văzut de nginx_proxy
#    - backend + db stau pe o rețea PRIVATĂ (statistic_internal), neexpuse
#    - nume fixe de containere (referite din vhost-ul proxy-ului)
#
#  Pornire pe server:
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#  Vezi: docs/operare/03-deployment.md
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: statistic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - statistic_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: statistic_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - statistic_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # GOL => cereri relative /api same-origin, dispecerul intern (nginx.conf)
        # le trimite la backend. Proxy-ul public termină TLS.
        VITE_API_URL: ${VITE_API_URL-}
    container_name: statistic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - statistic_internal   # ca să vadă backend:8000
      - shared-network       # ca să fie văzut de nginx_proxy

volumes:
  db_data:

networks:
  statistic_internal:
    driver: bridge
  # Rețeaua comună a proxy-ului public (există deja pe server).
  shared-network:
    external: true
